<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AetherVault — a dark, responsive PC game shelf template with searchable cards.">
<meta name="theme-color" content="#06070b">
<title>AetherVault — PC Games</title>
<style>
  :root {
    --bg: #06070b;
    --panel: rgba(12, 16, 26, 0.78);
    --card: #121722;
    --card-2: #181e2c;
    --line: rgba(140, 255, 214, 0.16);
    --text: #f4f7fb;
    --muted: #93a0b5;
    --mint: #3dffb0;
    --violet: #8b6cff;
    --pink: #ff4d8d;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
    font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px),
      radial-gradient(980px 520px at 0% -8%, rgba(139, 108, 255, 0.28), transparent 58%),
      radial-gradient(820px 460px at 100% 0%, rgba(61, 255, 176, 0.14), transparent 52%),
      radial-gradient(700px 420px at 70% 110%, rgba(255, 77, 141, 0.1), transparent 50%);
    background-size: 52px 52px, 52px 52px, auto, auto, auto;
  }

  ::selection { background: rgba(61, 255, 176, 0.28); color: #fff; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #090b11; }
  ::-webkit-scrollbar-thumb { background: #2a3348; border-radius: 99px; }

  a { color: inherit; }

  .wrap {
    width: min(1180px, calc(100% - 2rem));
    margin-inline: auto;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(16px);
    background: rgba(6, 7, 11, 0.78);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.25rem;
    min-height: 76px;
    padding: 0.85rem 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    text-decoration: none;
    min-width: 0;
  }

  .mark {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--mint), var(--violet));
    box-shadow: 0 0 22px rgba(61, 255, 176, 0.35);
    position: relative;
  }

  .mark::after {
    content: "";
    position: absolute;
    inset: 9px;
    border: 2px solid #07140f;
    border-radius: 4px;
    transform: rotate(45deg);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.05;
  }

  .brand-text strong {
    font-size: 1.25rem;
    letter-spacing: 0.04em;
    font-weight: 750;
  }

  .brand-text strong span {
    background: linear-gradient(90deg, var(--mint), #9d8cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand-text small {
    color: var(--muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 0.68rem;
    margin-top: 0.2rem;
  }

  .search {
    position: relative;
    flex: 1 1 320px;
    max-width: 440px;
  }

  .search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--mint);
    fill: none;
    stroke-width: 2;
    pointer-events: none;
  }

  .search input {
    width: 100%;
    border: 1px solid rgba(61, 255, 176, 0.28);
    background: rgba(8, 12, 20, 0.9);
    color: var(--text);
    border-radius: 999px;
    padding: 0.78rem 1rem 0.78rem 2.6rem;
    font: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search input::placeholder { color: #7d8aa0; }

  .search input:focus {
    border-color: var(--mint);
    box-shadow: 0 0 0 4px rgba(61, 255, 176, 0.12);
  }

  main { flex: 1; padding-bottom: 3rem; }

  .intro {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    padding: 2rem 0 1.25rem;
  }

  .eyebrow {
    margin: 0 0 0.4rem;
    color: var(--mint);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 0.72rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 4vw, 3rem);
    letter-spacing: -0.03em;
    line-height: 0.98;
  }

  .lede {
    margin: 0.65rem 0 0;
    max-width: 46ch;
    color: var(--muted);
    line-height: 1.5;
  }

  .count {
    margin: 0;
    padding: 0.55rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(61, 255, 176, 0.08);
    color: var(--mint);
    font-size: 0.92rem;
    white-space: nowrap;
  }

  .games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
    gap: 1.15rem;
  }

  .game-card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
  }

  .game-card::before,
  .game-card::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: rgba(61, 255, 176, 0.55);
    border-style: solid;
    pointer-events: none;
    z-index: 2;
  }

  .game-card::before {
    top: 10px;
    left: 10px;
    border-width: 2px 0 0 2px;
  }

  .game-card::after {
    right: 10px;
    bottom: 10px;
    border-width: 0 2px 2px 0;
  }

  .game-card:hover {
    transform: translateY(-6px);
    border-color: rgba(61, 255, 176, 0.45);
    box-shadow: 0 22px 46px rgba(0, 0, 0, 0.48), 0 0 0 1px rgba(61, 255, 176, 0.18);
  }

  .game-card img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: #0c111b;
    filter: none;
    -webkit-filter: none;
    opacity: 1;
    transition: transform 0.35s ease;
  }

  .game-card:hover img { transform: scale(1.05); }

  .game-card h3 {
    margin: 0.95rem 1rem 0.3rem;
    font-size: 1.12rem;
    letter-spacing: 0.01em;
    line-height: 1.25;
  }

  .size {
    margin: 0 1rem 0.95rem;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .size::before {
    content: "SIZE";
    display: inline-block;
    margin-right: 0.45rem;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: #6f7d93;
  }

  .download-btn {
    margin: auto 1rem 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    min-height: 42px;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #04140d;
    background: linear-gradient(90deg, var(--mint), #7dffe0);
    box-shadow: 0 8px 20px rgba(61, 255, 176, 0.18);
    transition: filter 0.2s, transform 0.2s;
  }

  .download-btn::after { content: "↓"; }

  .download-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .download-btn:focus-visible,
  .brand:focus-visible,
  .search input:focus-visible {
    outline: 2px solid var(--mint);
    outline-offset: 3px;
  }

  .empty {
    margin: 1.5rem 0 0;
    padding: 1.4rem;
    text-align: center;
    color: var(--muted);
    border: 1px dashed rgba(255, 255, 255, 0.14);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.02);
  }

  .empty[hidden] { display: none; }

  footer {
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(0, 0, 0, 0.28);
  }

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding: 1.1rem 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .foot strong { color: var(--text); letter-spacing: 0.04em; }

  @media (max-width: 720px) {
    .bar,
    .foot { flex-direction: column; align-items: stretch; }
    .bar { min-height: 0; }
    .search {
      flex: 0 0 auto;
      width: 100%;
      max-width: none;
      height: auto;
      min-height: 0;
      max-height: none;
    }
    .search svg {
      top: 50%;
      transform: translateY(-50%);
    }
    header {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: #06070b;
    }
    .count { align-self: flex-start; }

    .intro,
    .intro::before,
    .intro::after {
      display: none;
      min-height: 0;
      height: 0;
      max-height: 0;
      padding: 0;
      margin: 0;
      gap: 0;
      overflow: hidden;
      background: none;
      background-image: none;
      box-shadow: none;
      filter: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      content: none;
    }

    body {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
      background-size: 52px 52px, 52px 52px;
    }

    main { padding-top: 0; }

    .games { margin-top: 0.75rem; }

    .game-card img {
      width: 100%;
      height: 180px;
      min-height: 180px;
      max-height: 180px;
      aspect-ratio: auto;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #0c111b;
      filter: none;
      -webkit-filter: none;
      opacity: 1;
      transform: none;
    }

    .game-card:hover img { transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap bar">
      <a class="brand" href="#">
        <span class="mark" aria-hidden="true"></span>
        <span class="brand-text">
          <strong>Aether<span>Vault</span></strong>
          <small>PC Games</small>
        </span>
      </a>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="search" type="search" placeholder="Search games by name" autocomplete="off" aria-label="Search games by name">
      </label>
    </div>
  </header>

  <main>
    <section class="wrap intro">
      <div>
        <p class="eyebrow">Library</p>
        <h1>Your PC game shelf</h1>

      </div>
  
    </section>

    <section class="wrap">
      <div class="games" id="games">
        <!-- Copy this game-card div to add a game. Change the img src, the h3 name, and the size text (example: 45 GB). Keep class="game-card" and leave the Download link href as #. -->
        <div class="game-card">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmGr-xgXbROqHfxVzY2pLzi_zNhbU2RC29Uqar34LuKC3XatvB7Ng-WUs&s=10" alt="gta 6">
          <h3>GTA 6</h3>
          <p class="size">110 GB</p>
          <a class="download-btn" href="https://trckapp.org/fl/pe5o6">Download</a>
        </div>
        
      </div>
      <p class="empty" id="empty" hidden>No games match that name.</p>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <strong>AetherVault</strong>
      
    </div>
  </footer>

  <script>
    (function () {
      var input = document.getElementById("search");
      var cards = document.querySelectorAll(".game-card");
      var empty = document.getElementById("empty");
      var count = document.getElementById("count");

      function filterGames() {
        var query = input.value.trim().toLowerCase();
        var shown = 0;
        cards.forEach(function (card) {
          var name = card.querySelector("h3").textContent.toLowerCase();
          var match = name.indexOf(query) !== -1;
          card.style.display = match ? "" : "none";
          if (match) shown += 1;
        });
        empty.hidden = shown !== 0;
        count.textContent = shown + (shown === 1 ? " game" : " games");
      }

      input.addEventListener("input", filterGames);

      document.querySelectorAll(".download-btn").forEach(function (link) {
        link.addEventListener("click", function (event) {
          if (link.getAttribute("href") === "#") event.preventDefault();
        });
      });

      document.querySelectorAll(".game-card img").forEach(function (img) {
        img.addEventListener("error", function onErr() {
          img.removeEventListener("error", onErr);
          var label = (img.alt || "Game").replace(/&/g, "&amp;").replace(/</g, "&lt;");
          var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='640' height='360' viewBox='0 0 640 360'><rect width='640' height='360' fill='#121826'/><text x='320' y='180' fill='#3dffb0' font-family='Segoe UI,sans-serif' font-size='28' text-anchor='middle' dominant-baseline='middle'>" + label + "</text></svg>";
          img.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        });
      });
    })();
  </script>
</body>
</html>
